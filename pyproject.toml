[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flores"
version = "0.1.0"
description = "A small AI agent scaffold for local experimentation."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "OpenAI" }]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
